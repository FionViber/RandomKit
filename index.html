<style id="strict-square-fix">

*,*::before,*::after{border-radius:0!important}
svg rect{rx:0!important;ry:0!important}

</style>

.header-controls .button-label{display:inline!important}

<script>
(function (root) {
  "use strict";

  const LIMITS = Object.freeze({ entries: 10000, draw: 1000, history: 200, weight: 1000000, nameLength: 300, groupLength: 120, diceSides: 1000, numberRange: 1000000000, numberMagnitude: 1000000000000, importCharacters: 10 * 1024 * 1024 });

  function fail(code, details) {
    const error = new Error(code);
    error.code = code;
    if (details !== undefined) error.details = details;
    throw error;
  }

  function integerValue(value, code, min, max) {
    if (!Number.isSafeInteger(value) || value < min || value > max) fail(code, { min, max, value });
    return value;
  }

  function cryptoSource() {
    if (!root.crypto || typeof root.crypto.getRandomValues !== "function") fail("crypto_unavailable");
    return root.crypto;
  }

  function integer(min, max) {
    integerValue(min, "invalid_integer", -Number.MAX_SAFE_INTEGER, Number.MAX_SAFE_INTEGER);
    integerValue(max, "invalid_integer", -Number.MAX_SAFE_INTEGER, Number.MAX_SAFE_INTEGER);
    if (min > max) fail("invalid_range");
    const source = cryptoSource();
    const lower = BigInt(min);
    const width = BigInt(max) - lower + 1n;
    if (width === 1n) return min;
    const bits = (width - 1n).toString(2).length;
    const words = new Uint32Array(Math.ceil(bits / 32));
    const mask = (1n << BigInt(bits)) - 1n;
    let value;
    do {
      source.getRandomValues(words);
      value = 0n;
      for (const word of words) value = (value << 32n) | BigInt(word);
      value &= mask;
    } while (value >= width);
    return Number(lower + value);
  }

  function randomID() {
    const bytes = new Uint8Array(16);
    cryptoSource().getRandomValues(bytes);
    return Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
  }

  function shuffle(array) {
    if (!Array.isArray(array)) fail("invalid_entries");
    const result = array.slice();
    for (let i = result.length - 1; i > 0; i--) {
      const j = integer(0, i);
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function checkEntries(entries) {
    if (!Array.isArray(entries)) fail("invalid_entries");
    if (entries.length > LIMITS.entries) fail("too_many_entries", { max: LIMITS.entries });
    return entries.filter((entry, index) => {
      if (!entry || typeof entry !== "object" || Array.isArray(entry)) fail("invalid_entries", { row: index + 1 });
      if (typeof entry.name !== "string" || !entry.name.trim() || entry.name.length > LIMITS.nameLength) fail("invalid_name", { row: index + 1, max: LIMITS.nameLength });
      if (entry.enabled !== undefined && typeof entry.enabled !== "boolean") fail("invalid_enabled", { row: index + 1 });
      if (entry.weight !== undefined) integerValue(entry.weight, "invalid_weight", 1, LIMITS.weight);
      if (entry.group !== undefined && (typeof entry.group !== "string" || entry.group.length > LIMITS.groupLength)) fail("invalid_group", { row: index + 1, max: LIMITS.groupLength });
      return entry.enabled !== false;
    });
  }

  class Fenwick {
    constructor(weights) {
      this.length = weights.length;
      this.tree = new Float64Array(weights.length + 1);
      this.total = 0;
      for (let i = 0; i < weights.length; i++) this.add(i, weights[i]);
    }
    add(index, amount) {
      this.total += amount;
      for (let i = index + 1; i <= this.length; i += i & -i) this.tree[i] += amount;
    }
    find(ticket) {
      let index = 0;
      let bit = 1;
      while (bit * 2 <= this.length) bit *= 2;
      for (; bit > 0; bit = Math.floor(bit / 2)) {
        const next = index + bit;
        if (next <= this.length && this.tree[next] <= ticket) {
          index = next;
          ticket -= this.tree[next];
        }
      }
      return index;
    }
  }

  function pick(entries, count, options = {}) {
    integerValue(count, "invalid_count", 1, LIMITS.draw);
    const pool = checkEntries(entries);
    const unique = options.unique !== false;
    const weighted = options.weighted !== false;
    if (!pool.length || (unique && count > pool.length)) fail("insufficient_entries", { available: pool.length, requested: count });
    if (!weighted) {
      if (!unique) return Array.from({ length: count }, () => pool[integer(0, pool.length - 1)]);
      for (let i = 0; i < count; i++) {
        const j = integer(i, pool.length - 1);
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool.slice(0, count);
    }
    const weights = pool.map(entry => entry.weight === undefined ? 1 : entry.weight);
    const tree = new Fenwick(weights);
    const result = [];
    for (let i = 0; i < count; i++) {
      const index = tree.find(integer(0, tree.total - 1));
      result.push(pool[index]);
      if (unique) tree.add(index, -weights[index]);
    }
    return result;
  }

  class Heap {
    constructor(items, compare) {
      this.items = [];
      this.compare = compare;
      for (const item of items) this.push(item);
    }
    push(item) {
      const items = this.items;
      items.push(item);
      let i = items.length - 1;
      while (i > 0) {
        const parent = Math.floor((i - 1) / 2);
        if (this.compare(items[parent], items[i]) <= 0) break;
        [items[parent], items[i]] = [items[i], items[parent]];
        i = parent;
      }
    }
    pop() {
      const items = this.items;
      const result = items[0];
      const last = items.pop();
      if (items.length) {
        items[0] = last;
        let i = 0;
        for (;;) {
          const left = i * 2 + 1;
          const right = left + 1;
          let best = i;
          if (left < items.length && this.compare(items[left], items[best]) < 0) best = left;
          if (right < items.length && this.compare(items[right], items[best]) < 0) best = right;
          if (best === i) break;
          [items[i], items[best]] = [items[best], items[i]];
          i = best;
        }
      }
      return result;
    }
  }

  function group(entries, options = {}) {
    const pool = checkEntries(entries);
    if (!pool.length) fail("insufficient_entries", { available: 0 });
    const method = options.method === undefined ? "count" : options.method;
    if (method !== "count" && method !== "size") fail("invalid_group_method");
    const value = options.value === undefined ? 2 : options.value;
    integerValue(value, "invalid_group_count", 1, LIMITS.entries);
    const count = method === "size" ? Math.ceil(pool.length / value) : value;
    if (count > pool.length) fail("insufficient_entries", { available: pool.length, requested: count });
    const result = Array.from({ length: count }, () => []);
    const base = Math.floor(pool.length / count);
    const targets = Array(count).fill(base);
    const order = shuffle(Array.from({ length: count }, (_, i) => i));
    for (let i = 0; i < pool.length % count; i++) targets[order[i]]++;
    const mixed = shuffle(pool);
    if (!options.balanceTags || base === 1 && pool.length === count) {
      let cursor = 0;
      for (const index of order) {
        result[index] = mixed.slice(cursor, cursor + targets[index]);
        cursor += targets[index];
      }
      return result;
    }
    const buckets = new Map();
    const untagged = [];
    for (const entry of mixed) {
      const tag = (entry.group || "").trim();
      if (!tag) {
        untagged.push(entry);
      } else {
        if (!buckets.has(tag)) buckets.set(tag, []);
        buckets.get(tag).push(entry);
      }
    }
    const repeated = [];
    for (const bucket of buckets.values()) {
      if (bucket.length === 1) untagged.push(bucket[0]);
      else repeated.push(bucket);
    }
    const sorted = shuffle(repeated).sort((a, b) => b.length - a.length);
    const remaining = targets.slice();
    for (const bucket of sorted) {
      const heap = new Heap(order.filter(index => remaining[index] > 0).map((index, tie) => ({ index, used: 0, left: remaining[index], tie })), (a, b) => a.used - b.used || b.left - a.left || a.tie - b.tie);
      for (const entry of bucket) {
        const next = heap.pop();
        result[next.index].push(entry);
        remaining[next.index]--;
        next.left--;
        next.used++;
        if (next.left > 0) heap.push(next);
      }
    }
    let cursor = 0;
    for (const index of order) {
      while (remaining[index] > 0) {
        result[index].push(untagged[cursor++]);
        remaining[index]--;
      }
      result[index] = shuffle(result[index]);
    }
    return result;
  }

  function exclusionIntervals(text, min, max, step, length) {
